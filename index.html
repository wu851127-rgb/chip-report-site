<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>台股盤後籌碼儀表板</title>
    <link rel="stylesheet" href="./styles.css?v=20260920-legend-hierarchy" />
  </head>
  <body>
    <div class="shell">
      <aside id="sidebar" class="sidebar">
        <div class="brand">
          <p class="eyebrow">Daily Chip Flow</p>
          <h1>台股盤後籌碼</h1>
          <p class="subcopy">重新整理頁面可載入最新盤後數據，左側可檢視歷史交易日快照。<br />本資料為資訊整理與研究用途，使用者仍應自行判斷市場風險。</p>
        </div>
        <div class="history-panel">
          <div class="history-head">
            <div>
              <span>歷史快照</span>
              <small id="historyMeta" class="history-meta">載入中</small>
            </div>
            <div class="history-actions">
              <button id="historyToggleButton" class="history-toggle-button" type="button" aria-expanded="true">收合</button>
              <button id="historyLatestButton" type="button">最新</button>
              <button id="refreshButton" type="button">更新</button>
            </div>
          </div>
          <p class="history-legend" aria-label="歷史色條由左至右依序為大盤、外資期貨、選擇權輪廓與散戶位階；紅色代表走強或回補，綠色代表轉弱，粉色代表壓力或擁擠，灰色代表中性或訊號未同步。">
            <span title="大盤動能">市</span><span title="外資期貨">期</span><span title="選擇權輪廓">權</span><span title="散戶位階">散</span>
            <em>紅強／綠弱／粉壓／灰中性</em>
          </p>
          <label class="history-filter-label" for="historyMonthFilter">選擇月份</label>
          <select id="historyMonthFilter" class="history-month-filter"></select>
          <nav id="historyList" class="history-list"></nav>
        </div>
      </aside>

      <main class="content">
        <section class="hero">
          <div>
            <p class="eyebrow">Latest Snapshot</p>
            <h2 id="heroTitle">載入中...</h2>
            <p id="heroSubtitle" class="hero-subtitle"></p>
          </div>
          <div class="hero-side">
            <div class="status-panel">
              <div class="status-row">
                <span class="status-label">最新資料日期</span>
                <span id="statusLatestDate" class="status-value">—</span>
              </div>
              <div class="status-row">
                <span class="status-label">快照更新時間</span>
                <span id="statusGeneratedAt" class="status-value">—</span>
              </div>
              <div class="status-row">
                <span class="status-label">今日整理狀態</span>
                <span id="statusToday" class="status-pill">檢查中</span>
              </div>
            </div>
            <a id="downloadLink" class="download-link" href="#" target="_blank" rel="noreferrer">下載當日 Excel</a>
          </div>
        </section>

        <section class="tabs">
          <button class="tab is-active" data-tab="dashboard" type="button">主表｜市場總覽</button>
          <button class="tab" data-tab="detail" type="button">選擇權細項</button>
        </section>

        <section id="dashboardView" class="view is-active">
          <section id="marketPulse" class="market-pulse" hidden aria-label="Market Pulse 決策列"></section>
          <aside id="decisionFocus" class="decision-focus" hidden aria-label="當日決策焦點"></aside>
          <section id="trendStripPanel" class="trend-strip-panel" hidden aria-label="短線結構追蹤"></section>
          <article id="strategyPanel" class="strategy-panel" hidden>
            <div class="strategy-top">
              <p class="strategy-kicker">Desk View</p>
              <div class="strategy-signals">
                <span id="strategyFlag" class="strategy-flag" hidden></span>
                <span id="strategyTone" class="strategy-tone">中性</span>
              </div>
            </div>
            <p class="strategy-read-order">先看結論與節奏，再以底下資料驗證。</p>
            <div id="strategyDecision" class="strategy-decision"></div>
            <details id="strategyDetails" class="strategy-details">
              <summary>
                <span>完整判讀與證據</span>
                <small>展開閱讀</small>
              </summary>
              <div class="strategy-details-content">
                <h3 class="strategy-title">完整判讀</h3>
                <div id="strategyBody" class="strategy-body"></div>
              </div>
            </details>
          </article>
          <aside id="scPressurePanel" class="sc-pressure-panel" hidden></aside>
          <aside id="optionContourPanel" class="option-contour-panel" hidden></aside>
          <div id="dashboardSections" class="sections"></div>
          <article class="summary-block">
            <h3>摘要</h3>
            <p id="dashboardSummary"></p>
          </article>
        </section>

        <section id="detailView" class="view">
          <div id="detailSections" class="sections"></div>
        </section>
      </main>
    </div>

    <template id="sectionTemplate">
      <section class="section-block">
        <div class="section-head">
          <h3></h3>
          <span class="section-meta"></span>
        </div>
        <div class="card-grid"></div>
      </section>
    </template>

    <template id="cardTemplate">
      <article class="card">
        <div class="card-top">
          <span class="card-signal" hidden></span>
          <span class="card-alert-badge" hidden></span>
        </div>
        <p class="card-label"></p>
        <p class="card-value"></p>
        <p class="card-note"></p>
      </article>
    </template>

    <aside id="cardTooltip" class="card-tooltip" role="tooltip" hidden>
      <p class="card-tooltip-kicker">RELATED DATA</p>
      <p class="card-tooltip-title"></p>
      <p class="card-tooltip-value"></p>
      <p class="card-tooltip-note"></p>
      <p class="card-tooltip-insight"></p>
    </aside>

    <aside id="trendTooltip" class="trend-tooltip" role="tooltip" hidden>
      <p class="trend-tooltip-kicker">STRUCTURE GUIDE</p>
      <p class="trend-tooltip-title"></p>
      <p class="trend-tooltip-value"></p>
      <p class="trend-tooltip-formula"></p>
      <p class="trend-tooltip-reading"></p>
    </aside>

    <script type="module" src="./app.js?v=20260920-legend-hierarchy"></script>
  </body>
</html>
